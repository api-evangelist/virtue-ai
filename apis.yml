name: Virtue Ai
description: >-
  Virtue AI is an enterprise AI security and safety company that secures AI
  agents, models, and applications across an organization. Its platform pairs
  real-time guardrails (VirtueGuard) with automated red-teaming (VirtueRed) and
  an agent-security suite (AgentSuite-Blue and AgentSuite-Red) to detect and
  prevent AI-related risks such as prompt injection, unsafe tool use, data
  exfiltration, and unsanctioned agents and apps running across cloud and
  endpoints. Virtue AI also ships an MCP gateway that proxies Model Context
  Protocol tool calls through policy enforcement, an official CLI connector for
  wiring agent runtimes into that gateway, and a Python package for building on
  its guardrail and evaluation tooling. The company is backed by Lightspeed
  Venture Partners and maintains a public developer docs site, research and
  benchmark leaderboards, and a Vanta-hosted trust center.
